            </button>
            <div class="language-list" role="listbox" hidden>
              <button class="language-choice" type="button" role="option" data-language-choice="ja" aria-selected="true">日本語</button>
              <button class="language-choice" type="button" role="option" data-language-choice="en" aria-selected="false">English</button>
              <button class="language-choice" type="button" role="option" data-language-choice="de" aria-selected="false">Deutsch</button>

        <nav class="top-links" aria-label="ページリンク">
          <a class="button" href="../index.html#games" data-i18n-ja="タイトル一覧" data-i18n-en="Titles" data-i18n-de="Titel" data-i18n-zh-hant="標題列表">
            タイトル一覧

    <main>
      <section class="hero">
        <span class="hero-art" aria-hidden="true"></span>
        <div class="wrap hero-grid">
          <div class="hero-copy">
            <h1>Skill Hockey</h1>
            <p class="summary" data-i18n-ja="コマンド入力でスキルを発動！ド派手に決めるエアホッケー！" data-i18n-en="A flashy air hockey game where command inputs trigger special skills." data-i18n-de="Ein auffälliges Air-Hockey-Spiel, in dem Kommandos Spezialskills auslösen." data-i18n-zh-hant="輸入指令發動技能！華麗決勝的空氣曲棍球！">
              コマンド入力でスキルを発動！ド派手に決めるエアホッケー！
            </p>
            <div class="status-row">
              <span class="label label-muted" data-i18n-ja="開発中" data-i18n-en="In development" data-i18n-de="In Entwicklung" data-i18n-zh-hant="開發中">開発中</span>
            </div>
          </div>
          <a class="steam-store-link" href="https://store.steampowered.com/app/3074910/Skill_Hockey/" target="_blank" rel="noopener" aria-label="Skill Hockey のSteamページを開く">
            <img class="steam-store-logo" src="../assets/platforms/steam-logo.svg" alt="Steam" />
          </a>
        </div>
      </section>

      <section class="text-band">
        <div class="wrap text-blocks">
          <article class="text-block">
            <h2 data-i18n-ja="概要" data-i18n-en="About" data-i18n-de="Über das Spiel" data-i18n-zh-hant="遊戲介紹">概要</h2>
            <p data-i18n-ja="プレイ中にコマンドを入力し、必殺技を発動するエアホッケー。&#10;&#10;パックを打ち返したり壁に当てたりすることでスキルゲージが溜まる。&#10;&#10;ゲージ量に応じて、キャラクターごとのスキルを発動可能。&#10;&#10;分身するパック、消えるパック、曲がるパックを駆使して相手をK.O.する。" data-i18n-en="An air hockey game where command inputs trigger flashy special moves.&#10;&#10;Returning the puck and bouncing it off walls fills the skill gauge.&#10;&#10;Each character can unleash different skills depending on how much gauge they have.&#10;&#10;Use splitting, vanishing, and curving pucks to K.O. your opponent." data-i18n-de="Air Hockey, bei dem du während des Spiels Kommandos eingibst und Spezialangriffe auslöst.&#10;&#10;Durch Zurückschlagen des Pucks und Wandtreffer füllt sich die Skill-Leiste.&#10;&#10;Je nach Füllstand können charaktereigene Skills aktiviert werden.&#10;&#10;Nutze Pucks, die sich teilen, verschwinden oder krümmen, um den Gegner K.O. zu schlagen." data-i18n-zh-hant="在遊玩中輸入指令，發動必殺技的空氣曲棍球。&#10;&#10;回擊球盤或讓它撞上牆壁，就能累積技能量表。&#10;&#10;依照量表累積程度，可以發動各角色不同的技能。&#10;&#10;活用分身、消失、彎曲的球盤，將對手 K.O.。">プレイ中にコマンドを入力し、必殺技を発動するエアホッケー。

パックを打ち返したり壁に当てたりすることでスキルゲージが溜まる。

ゲージ量に応じて、キャラクターごとのスキルを発動可能。

分身するパック、消えるパック、曲がるパックを駆使して相手をK.O.する。</p>
          </article>
          <article class="text-block">
            <h2 data-i18n-ja="今後の予定" data-i18n-en="Plans" data-i18n-de="Pläne" data-i18n-zh-hant="後續計畫">今後の予定</h2>
            <ul class="info-list">
              <li data-i18n-html-ja="リリース予定: 未定" data-i18n-html-en="Release date: TBA" data-i18n-html-de="Veröffentlichung: TBA" data-i18n-html-zh-hant="發售日: 未定">リリース予定: 未定</li>
            </ul>
          </article>
          <article class="text-block">
            <h2 data-i18n-ja="活動記録" data-i18n-en="History" data-i18n-de="Aktivitäten" data-i18n-zh-hant="活動記錄">活動記録</h2>
            <ul class="info-list">
              <li data-i18n-html-ja="BitSummit" data-i18n-html-en="BitSummit" data-i18n-html-de="BitSummit" data-i18n-html-zh-hant="BitSummit">BitSummit</li>
              <li data-i18n-html-ja="C105" data-i18n-html-en="C105" data-i18n-html-de="C105" data-i18n-html-zh-hant="C105">C105</li>
              <li data-i18n-html-ja="ゲームダンジョン" data-i18n-html-en="Game Dungeon" data-i18n-html-de="Game Dungeon" data-i18n-html-zh-hant="Game Dungeon">ゲームダンジョン</li>
              <li data-i18n-html-ja="C104" data-i18n-html-en="C104" data-i18n-html-de="C104" data-i18n-html-zh-hant="C104">C104</li>
            </ul>
          </article>
        </div>
      </section>

      <section class="visual-band">
        <div class="wrap">
          <div class="band-head">
            <h2>Visuals</h2>
          </div>
          <div class="screenshot-carousel" data-screenshot-carousel>
            <figure class="screenshot-slide is-active">
              <img src="../assets/games/SkillHockey/ScreenShot01.png" alt="Skill Hockey screenshot 01" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/SkillHockey/ScreenShot02.png" alt="Skill Hockey screenshot 02" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/SkillHockey/ScreenShot03.png" alt="Skill Hockey screenshot 03" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/SkillHockey/ScreenShot04.png" alt="Skill Hockey screenshot 04" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/SkillHockey/ScreenShot05.png" alt="Skill Hockey screenshot 05" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/SkillHockey/ScreenShot06.png" alt="Skill Hockey screenshot 06" />
            </figure>
            <div class="screenshot-controls" aria-label="スクリーンショット切り替え"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const languageKey = "bogosorstudio-language";
      const supportedLanguages = ["ja", "en", "de", "zh-hant"];
      const languageLabels = {
        ja: "日本語",
        en: "English",
        de: "Deutsch",
        "zh-hant": "繁體中文",
      };
      const htmlLanguageCodes = {
        ja: "ja",
        en: "en",
        de: "de",
        "zh-hant": "zh-Hant",
      };
      const languageMenu = document.querySelector("[data-language-menu]");
      const languageButton = document.querySelector(".language-button");
      const languageList = document.querySelector(".language-list");
      const languageCurrent = document.querySelector("[data-language-current]");
      const languageChoices = [...document.querySelectorAll("[data-language-choice]")];
      const translatable = [...document.querySelectorAll("[data-i18n-ja]")];
      const htmlTranslatable = [...document.querySelectorAll("[data-i18n-html-ja]")];

      const normalizeLanguage = (language) => supportedLanguages.includes(language) ? language : "ja";

      const closeLanguageMenu = () => {
        languageList?.setAttribute("hidden", "");
        languageButton?.setAttribute("aria-expanded", "false");
      };

      const openLanguageMenu = () => {
        languageList?.removeAttribute("hidden");
        languageButton?.setAttribute("aria-expanded", "true");
      };

      const setLanguage = (language) => {
        const nextLanguage = normalizeLanguage(language);
        document.documentElement.lang = htmlLanguageCodes[nextLanguage] || nextLanguage;
        translatable.forEach((node) => {
          node.textContent = node.getAttribute(`data-i18n-${nextLanguage}`) || node.getAttribute("data-i18n-ja") || "";
        });
        htmlTranslatable.forEach((node) => {
          node.innerHTML = node.getAttribute(`data-i18n-html-${nextLanguage}`) || node.getAttribute("data-i18n-html-ja") || "";
        });
        if (languageCurrent) languageCurrent.textContent = languageLabels[nextLanguage];
        languageChoices.forEach((choice) => {
          choice.setAttribute("aria-selected", String(choice.dataset.languageChoice === nextLanguage));
        });
        localStorage.setItem(languageKey, nextLanguage);
        closeLanguageMenu();
      };

      languageButton?.addEventListener("click", (event) => {
        event.stopPropagation();
        if (languageList?.hasAttribute("hidden")) {
          openLanguageMenu();
        } else {
          closeLanguageMenu();
        }
      });

      languageChoices.forEach((choice) => {
        choice.addEventListener("click", () => setLanguage(choice.dataset.languageChoice));
      });

      document.addEventListener("click", (event) => {
        if (!languageMenu?.contains(event.target)) closeLanguageMenu();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLanguageMenu();
      });

      setLanguage(localStorage.getItem(languageKey) || "ja");
      let imageLightbox;

      const closeLightbox = () => {
        if (!imageLightbox) return;
        imageLightbox.hidden = true;
        document.body.style.overflow = "";
      };

      const openLightbox = ({ alt, src }) => {
        if (!imageLightbox) {
          imageLightbox = document.createElement("div");
          imageLightbox.className = "image-lightbox";
          imageLightbox.hidden = true;
          imageLightbox.innerHTML = `
            <button class="lightbox-close" type="button" aria-label="閉じる">×</button>
            <img alt="" />
          `;
          imageLightbox.addEventListener("click", (event) => {
            if (event.target === imageLightbox) closeLightbox();
          });
          imageLightbox.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
          document.body.append(imageLightbox);
        }

        const image = imageLightbox.querySelector("img");
        image.src = src;
        image.alt = alt;
        imageLightbox.hidden = false;
        document.body.style.overflow = "hidden";
      };

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLightbox();
      });

      document.querySelectorAll("[data-screenshot-carousel]").forEach((carousel) => {
        const screenshots = [...carousel.querySelectorAll(".screenshot-slide img")].map((image) => ({
          alt: image.alt,
          src: image.getAttribute("src"),
        }));
        const shouldReduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let activeIndex = 0;
        let isAnimating = false;
        let timerId;

        if (!screenshots.length) return;

        carousel.textContent = "";

        const wrapIndex = (index) => (index + screenshots.length) % screenshots.length;
        const viewport = document.createElement("div");
        viewport.className = "screenshot-viewport";
        carousel.append(viewport);

        const slots = [
          { className: "slot-prev is-side", offset: -1 },
          { className: "slot-active is-active", offset: 0 },
          { className: "slot-next is-side", offset: 1 },
        ].map((slot) => {
          const figure = document.createElement("figure");
          const image = document.createElement("img");
          figure.className = `screenshot-slide ${slot.className}`;
          figure.tabIndex = 0;
          figure.setAttribute("role", "button");
          figure.append(image);
          figure.addEventListener("click", () => {
            openLightbox(screenshots[Number(figure.dataset.index)]);
          });
          figure.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            openLightbox(screenshots[Number(figure.dataset.index)]);
          });
          viewport.append(figure);
          return { ...slot, figure, image };
        });

        const prevButton = document.createElement("button");
        prevButton.type = "button";
        prevButton.className = "screenshot-arrow screenshot-arrow-prev";
        prevButton.setAttribute("aria-label", "前のスクリーンショット");
        prevButton.textContent = "‹";
        viewport.append(prevButton);

        const nextButton = document.createElement("button");
        nextButton.type = "button";
        nextButton.className = "screenshot-arrow screenshot-arrow-next";
        nextButton.setAttribute("aria-label", "次のスクリーンショット");
        nextButton.textContent = "›";
        viewport.append(nextButton);

        const controls = document.createElement("div");
        controls.className = "screenshot-controls";
        controls.setAttribute("aria-label", "スクリーンショット切り替え");
        carousel.append(controls);

        const paintSlots = (centerIndex, overrides = {}) => {
          slots.forEach((slot) => {
            const index = overrides[slot.offset] ?? wrapIndex(centerIndex + slot.offset);
            const screenshot = screenshots[index];
            slot.figure.dataset.index = String(index);
            slot.image.src = screenshot.src;
            slot.image.alt = screenshot.alt;
          });
          controls.querySelectorAll(".screenshot-dot").forEach((dot, index) => {
            dot.classList.toggle("is-active", index === centerIndex);
            dot.setAttribute("aria-current", index === centerIndex ? "true" : "false");
          });
        };

        const showSlide = (nextIndex, direction = "next", animate = true) => {
          const targetIndex = wrapIndex(nextIndex);
          if (targetIndex === activeIndex || isAnimating) return;

          if (shouldReduceMotion || !animate) {
            activeIndex = targetIndex;
            paintSlots(activeIndex);
            return;
          }

          isAnimating = true;
          paintSlots(activeIndex, direction === "next" ? { 1: targetIndex } : { [-1]: targetIndex });
          carousel.classList.add(direction === "next" ? "is-moving-next" : "is-moving-prev");

          window.setTimeout(() => {
            activeIndex = targetIndex;
            carousel.classList.add("is-resetting");
            carousel.classList.remove("is-moving-next", "is-moving-prev");
            paintSlots(activeIndex);
            carousel.offsetHeight;
            window.requestAnimationFrame(() => {
              carousel.classList.remove("is-resetting");
              isAnimating = false;
            });
          }, 380);
        };

        const startAutoPlay = () => {
          if (shouldReduceMotion || screenshots.length < 2) return;
          timerId = window.setInterval(() => showSlide(activeIndex + 1, "next"), 5200);
        };

        if (screenshots.length > 1) {
          prevButton.addEventListener("click", () => {
            window.clearInterval(timerId);
            showSlide(activeIndex - 1, "prev");
            startAutoPlay();
          });

          nextButton.addEventListener("click", () => {
            window.clearInterval(timerId);
            showSlide(activeIndex + 1, "next");
            startAutoPlay();
          });

          screenshots.forEach((_, index) => {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.className = "screenshot-dot";
            dot.setAttribute("aria-label", `ScreenShot${String(index + 1).padStart(2, "0")}`);
            dot.addEventListener("click", () => {
              window.clearInterval(timerId);
              showSlide(index, index > activeIndex ? "next" : "prev");
              startAutoPlay();
            });
            controls.append(dot);
          });
        } else {
          prevButton.hidden = true;
          nextButton.hidden = true;
        }

        paintSlots(activeIndex);
        startAutoPlay();
      });
    </script>
  </body>
</html>
