<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="REVERSI 2048 の紹介ページ。Steamページ、更新情報、関連リンクを掲載しています。"
    />
    <meta property="og:title" content="REVERSI 2048 | BogosorStudio" />
    <meta
      property="og:description"
      content="REVERSI 2048 の紹介ページ。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="../assets/games/Reversi2048/KeyArt.png" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />

    <title>REVERSI 2048 | BogosorStudio</title>
    <link rel="stylesheet" href="./game-page.css" />

    <style>
      :root {
        --hero-art: url("../assets/games/Reversi2048/LibraryHero.png");
        --shot-1: url("../assets/games/Reversi2048/ScreenShot01.png");
        --shot-2: url("../assets/games/Reversi2048/ScreenShot02.png");
        --shot-3: url("../assets/games/Reversi2048/ScreenShot03.png");
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <div class="brand-cluster">
          <a class="brand" href="../index.html">BogosorStudio</a>
          <button class="lang-toggle" type="button" aria-label="日本語と英語を切り替え">
            <span class="lang-option is-active" data-lang-option="ja">JP</span>
            <span>/</span>
            <span class="lang-option" data-lang-option="en">EN</span>
          </button>
        </div>
        <nav class="top-links" aria-label="ページリンク">
          <a class="button" href="../index.html#games" data-ja="タイトル一覧" data-en="Titles">
            タイトル一覧
          </a>
          <a
            class="button button-primary"
            href="https://store.steampowered.com/app/4619930/Reversi2048/" target="_blank" rel="noopener"
          >
            Steam
          </a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <span class="hero-art" aria-hidden="true"></span>
        <div class="wrap hero-grid">
          <h1>REVERSI 2048</h1>
          <p class="summary" data-ja="駒をひっくり返すごとにスコアが倍になるReversi" data-en="A Reversi where the score doubles every time you flip a piece.">
            駒をひっくり返すごとにスコアが倍になるReversi
          </p>
          <div class="status-row">
            <span class="label" data-ja="2026年10月リリース予定" data-en="Oct 2026: planned release">2026年10月リリース予定</span>
            <span class="label label-muted" data-ja="開発中" data-en="In development">開発中</span>
          </div>
          <div class="action-row">
            <a
              class="button button-primary"
              href="https://store.steampowered.com/app/4619930/Reversi2048/" target="_blank" rel="noopener"
            >
              Steam
            </a>
          </div>
        </div>
      </section>

      <section class="text-band">
        <div class="wrap text-blocks">
          <article class="text-block">
            <h2 data-ja="概要" data-en="About">概要</h2>
            <p data-ja="Reversiにひとつだけ新しいルールを足したゲーム。&#10;&#10;駒をひっくり返すたびに、その駒の数値が2、4、8、16と倍になっていく。&#10;&#10;勝敗を決めるのは駒の数ではなく、盤面全体の合計スコア。&#10;&#10;大量の高得点駒を一気に返せば、負けかけの盤面からでもひっくり返せる。" data-en="Reversi with one new rule.&#10;&#10;Every time a piece is flipped, its value doubles: 2, 4, 8, 16, and beyond.&#10;&#10;Victory is decided by total score, not by how many pieces you control.&#10;&#10;Flipping several high-value pieces at once can turn the whole match around.">Reversiにひとつだけ新しいルールを足したゲーム。

駒をひっくり返すたびに、その駒の数値が2、4、8、16と倍になっていく。

勝敗を決めるのは駒の数ではなく、盤面全体の合計スコア。

大量の高得点駒を一気に返せば、負けかけの盤面からでもひっくり返せる。</p>
          </article>
          <article class="text-block">
            <h2 data-ja="今後の予定" data-en="Plans">今後の予定</h2>
            <ul class="info-list">
              <li data-ja-html="2026年10月リリース予定" data-en-html="Oct 2026: Planned release">2026年10月リリース予定</li>
            </ul>
          </article>
          <article class="text-block">
            <h2 data-ja="活動記録" data-en="History">活動記録</h2>
            <ul class="info-list">
              <li data-ja-html="Steamページ準備中" data-en-html="Steam page in preparation">Steamページ準備中</li>
            </ul>
          </article>
        </div>
      </section>

      <section class="visual-band">
        <div class="wrap">
          <div class="band-head">
            <h2>Visuals</h2>
          </div>
          <div class="screenshot-carousel" data-screenshot-carousel>
            <figure class="screenshot-slide is-active">
              <img src="../assets/games/Reversi2048/ScreenShot01.png" alt="REVERSI 2048 screenshot 01" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/Reversi2048/ScreenShot02.png" alt="REVERSI 2048 screenshot 02" />
            </figure>
            <figure class="screenshot-slide">
              <img src="../assets/games/Reversi2048/ScreenShot03.png" alt="REVERSI 2048 screenshot 03" />
            </figure>
            <div class="screenshot-controls" aria-label="スクリーンショット切り替え"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const languageKey = "bogosorstudio-language";
      const langToggle = document.querySelector(".lang-toggle");
      const langOptions = [...document.querySelectorAll("[data-lang-option]")];
      const translatable = [...document.querySelectorAll("[data-ja][data-en]")];
      const htmlTranslatable = [...document.querySelectorAll("[data-ja-html][data-en-html]")];

      const setLanguage = (language) => {
        const nextLanguage = language === "en" ? "en" : "ja";
        document.documentElement.lang = nextLanguage;
        translatable.forEach((node) => {
          node.textContent = node.dataset[nextLanguage];
        });
        htmlTranslatable.forEach((node) => {
          node.innerHTML = node.dataset[`${nextLanguage}Html`];
        });
        langOptions.forEach((option) => {
          option.classList.toggle("is-active", option.dataset.langOption === nextLanguage);
        });
        localStorage.setItem(languageKey, nextLanguage);
      };

      langToggle?.addEventListener("click", () => {
        const currentLanguage = document.documentElement.lang === "en" ? "en" : "ja";
        setLanguage(currentLanguage === "en" ? "ja" : "en");
      });

      setLanguage(localStorage.getItem(languageKey) || "ja");

      let imageLightbox;

      const closeLightbox = () => {
        if (!imageLightbox) return;
        imageLightbox.hidden = true;
        document.body.style.overflow = "";
      };

      const openLightbox = ({ alt, src }) => {
        if (!imageLightbox) {
          imageLightbox = document.createElement("div");
          imageLightbox.className = "image-lightbox";
          imageLightbox.hidden = true;
          imageLightbox.innerHTML = `
            <button class="lightbox-close" type="button" aria-label="閉じる">×</button>
            <img alt="" />
          `;
          imageLightbox.addEventListener("click", (event) => {
            if (event.target === imageLightbox) closeLightbox();
          });
          imageLightbox.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
          document.body.append(imageLightbox);
        }

        const image = imageLightbox.querySelector("img");
        image.src = src;
        image.alt = alt;
        imageLightbox.hidden = false;
        document.body.style.overflow = "hidden";
      };

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeLightbox();
      });

      document.querySelectorAll("[data-screenshot-carousel]").forEach((carousel) => {
        const screenshots = [...carousel.querySelectorAll(".screenshot-slide img")].map((image) => ({
          alt: image.alt,
          src: image.getAttribute("src"),
        }));
        const shouldReduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        let activeIndex = 0;
        let isAnimating = false;
        let timerId;

        if (!screenshots.length) return;

        carousel.textContent = "";

        const wrapIndex = (index) => (index + screenshots.length) % screenshots.length;
        const viewport = document.createElement("div");
        viewport.className = "screenshot-viewport";
        carousel.append(viewport);

        const slots = [
          { className: "slot-prev is-side", offset: -1 },
          { className: "slot-active is-active", offset: 0 },
          { className: "slot-next is-side", offset: 1 },
        ].map((slot) => {
          const figure = document.createElement("figure");
          const image = document.createElement("img");
          figure.className = `screenshot-slide ${slot.className}`;
          figure.tabIndex = 0;
          figure.setAttribute("role", "button");
          figure.append(image);
          figure.addEventListener("click", () => {
            openLightbox(screenshots[Number(figure.dataset.index)]);
          });
          figure.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            openLightbox(screenshots[Number(figure.dataset.index)]);
          });
          viewport.append(figure);
          return { ...slot, figure, image };
        });

        const prevButton = document.createElement("button");
        prevButton.type = "button";
        prevButton.className = "screenshot-arrow screenshot-arrow-prev";
        prevButton.setAttribute("aria-label", "前のスクリーンショット");
        prevButton.textContent = "‹";
        viewport.append(prevButton);

        const nextButton = document.createElement("button");
        nextButton.type = "button";
        nextButton.className = "screenshot-arrow screenshot-arrow-next";
        nextButton.setAttribute("aria-label", "次のスクリーンショット");
        nextButton.textContent = "›";
        viewport.append(nextButton);

        const controls = document.createElement("div");
        controls.className = "screenshot-controls";
        controls.setAttribute("aria-label", "スクリーンショット切り替え");
        carousel.append(controls);

        const paintSlots = (centerIndex, overrides = {}) => {
          slots.forEach((slot) => {
            const index = overrides[slot.offset] ?? wrapIndex(centerIndex + slot.offset);
            const screenshot = screenshots[index];
            slot.figure.dataset.index = String(index);
            slot.image.src = screenshot.src;
            slot.image.alt = screenshot.alt;
          });
          controls.querySelectorAll(".screenshot-dot").forEach((dot, index) => {
            dot.classList.toggle("is-active", index === centerIndex);
            dot.setAttribute("aria-current", index === centerIndex ? "true" : "false");
          });
        };

        const showSlide = (nextIndex, direction = "next", animate = true) => {
          const targetIndex = wrapIndex(nextIndex);
          if (targetIndex === activeIndex || isAnimating) return;

          if (shouldReduceMotion || !animate) {
            activeIndex = targetIndex;
            paintSlots(activeIndex);
            return;
          }

          isAnimating = true;
          paintSlots(activeIndex, direction === "next" ? { 1: targetIndex } : { [-1]: targetIndex });
          carousel.classList.add(direction === "next" ? "is-moving-next" : "is-moving-prev");

          window.setTimeout(() => {
            activeIndex = targetIndex;
            carousel.classList.add("is-resetting");
            carousel.classList.remove("is-moving-next", "is-moving-prev");
            paintSlots(activeIndex);
            carousel.offsetHeight;
            window.requestAnimationFrame(() => {
              carousel.classList.remove("is-resetting");
              isAnimating = false;
            });
          }, 380);
        };

        const startAutoPlay = () => {
          if (shouldReduceMotion || screenshots.length < 2) return;
          timerId = window.setInterval(() => showSlide(activeIndex + 1, "next"), 5200);
        };

        if (screenshots.length > 1) {
          prevButton.addEventListener("click", () => {
            window.clearInterval(timerId);
            showSlide(activeIndex - 1, "prev");
            startAutoPlay();
          });

          nextButton.addEventListener("click", () => {
            window.clearInterval(timerId);
            showSlide(activeIndex + 1, "next");
            startAutoPlay();
          });

          screenshots.forEach((_, index) => {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.className = "screenshot-dot";
            dot.setAttribute("aria-label", `ScreenShot${String(index + 1).padStart(2, "0")}`);
            dot.addEventListener("click", () => {
              window.clearInterval(timerId);
              showSlide(index, index > activeIndex ? "next" : "prev");
              startAutoPlay();
            });
            controls.append(dot);
          });
        } else {
          prevButton.hidden = true;
          nextButton.hidden = true;
        }

        paintSlots(activeIndex);
        startAutoPlay();
      });
    </script>
  </body>
</html>
